identity:
  name: generate_docx
  author: ai-doc
  label:
    en_US: Generate Word (.docx)
    zh_Hans: 生成 Word 文档 (.docx)
  description:
    human:
      en_US: Create a Microsoft Word (.docx) document from a title, ordered paragraphs (headings, bullets, alignment) and tables. Returns a public download link.
      zh_Hans: 根据标题、有序段落(标题级别/项目符号/对齐)和表格生成 Word (.docx) 文档,返回公开下载链接。
    llm: Create a Microsoft Word (.docx) document. Provide structured content: title, paragraphs (with optional level 1-6 headings, bold, italic, bullet, align, fontSize, color), and tables (columns + rows). The tool returns a JSON object with a public download url.
parameters:
  - name: base_url
    type: string
    required: true
    label:
      en_US: Service Base URL
      zh_Hans: 服务地址
    human_description:
      en_US: Base URL of the ai-doc HTTP service, e.g. http://127.0.0.1:3000
      zh_Hans: ai-doc HTTP 服务地址,例如 http://127.0.0.1:3000
    placeholder:
      en_US: http://127.0.0.1:3000
    form: form
  - name: title
    type: string
    required: false
    label:
      en_US: Title
      zh_Hans: 标题
    human_description:
      en_US: Document title (rendered as a centered heading).
      zh_Hans: 文档标题(居中显示)。
    form: llm
  - name: author
    type: string
    required: false
    label:
      en_US: Author
    form: llm
  - name: paragraphs
    type: array
    required: false
    label:
      en_US: Paragraphs
      zh_Hans: 段落
    human_description:
      en_US: Ordered body content. Each item: {text, level (1-6 heading, omit for body), bold, italic, bullet, align(left/center/right/justify), fontSize, color(#RRGGBB)}.
      zh_Hans: 有序正文内容。每项:{text 文本, level 标题级别1-6(正文省略), bold 加粗, italic 斜体, bullet 项目符号, align 对齐, fontSize 字号, color 颜色}。
    form: llm
  - name: tables
    type: array
    required: false
    label:
      en_US: Tables
    human_description:
      en_US: Optional tables. Each item: {columns:[{key,header}], rows: [{key:value}]}.
    form: llm
  - name: footer
    type: string
    required: false
    label:
      en_US: Footer
    form: llm
