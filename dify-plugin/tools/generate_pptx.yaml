identity:
  name: generate_pptx
  author: ai-doc
  label:
    en_US: Generate PowerPoint (.pptx)
    zh_Hans: 生成 PowerPoint (.pptx)
  description:
    human:
      en_US: Create a PowerPoint presentation with a title slide plus content slides (title/subtitle/bullets). Returns a public download link.
      zh_Hans: 生成包含标题页和内容页(标题/副标题/要点)的 PowerPoint(.pptx),返回公开下载链接。
    llm: Create a PowerPoint (.pptx) presentation. Provide title, optional author, and slides: [{title, subtitle, bullets:[string], layout("title"|"title_content")}]. The tool returns a JSON object with a public download url.
parameters:
  - name: base_url
    type: string
    required: true
    label:
      en_US: Service Base URL
      zh_Hans: 服务地址
    human_description:
      en_US: Base URL of the ai-doc HTTP service, e.g. http://127.0.0.1:3000
      zh_Hans: ai-doc HTTP 服务地址,例如 http://127.0.0.1:3000
    placeholder:
      en_US: http://127.0.0.1:3000
    form: form
  - name: title
    type: string
    required: true
    label:
      en_US: Presentation Title
      zh_Hans: 演示文稿标题
    form: llm
  - name: author
    type: string
    required: false
    label:
      en_US: Author
    form: llm
  - name: slides
    type: array
    required: true
    label:
      en_US: Slides
      zh_Hans: 幻灯片
    human_description:
      en_US: Content slides. Each item: {title, subtitle, bullets:[string], layout("title"|"title_content"), footer}.
      zh_Hans: 内容页。每项:{title 标题, subtitle 副标题, bullets 要点列表, layout 布局, footer 页脚}。
    form: llm
