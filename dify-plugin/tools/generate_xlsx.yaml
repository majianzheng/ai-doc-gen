identity:
  name: generate_xlsx
  author: ai-doc
  label:
    en_US: Generate Excel (.xlsx)
    zh_Hans: 生成 Excel (.xlsx)
parameters:
- name: base_url
  type: string
  required: true
  label:
    en_US: Service Base URL
    zh_Hans: 服务地址
  human_description:
    en_US: Base URL of the ai-doc HTTP service, e.g. http://127.0.0.1:3000
    zh_Hans: ai-doc HTTP 服务地址,例如 http://127.0.0.1:3000
  placeholder:
    en_US: http://127.0.0.1:3000
  form: form
- name: username
  type: string
  required: true
  label:
    en_US: Username
    zh_Hans: 用户名
  human_description:
    en_US: 'REQUIRED: the SSO username of the user generating this document. The file
      is scoped to this user (not "system"). Fill it with the current user identity,
      do not invent one.'
    zh_Hans: 必填:发起生成的用户(SSO 用户名)。文档将归属到该用户而不是【系统】。请填当前真实用户,
      不要编造。
  placeholder:
    en_US: e.g. zhangsan
    zh_Hans: 例如 zhangsan
  form: llm
- name: filename
  type: string
  required: true
  label:
    en_US: File name
    zh_Hans: 文件名
  human_description:
    en_US: 'REQUIRED: download file name WITHOUT extension, concise and readable, e.g.
      2025年销售台账.'
    zh_Hans: 必填:下载文件名(不含扩展名),简洁可读,如 2025年销售台账、数据明细。
  form: llm
- name: title
  type: string
  required: true
  label:
    en_US: Title
    zh_Hans: 标题
  human_description:
    en_US: REQUIRED. Workbook title.
    zh_Hans: 必填。工作簿标题。
  form: llm
- name: sheets
  type: array
  required: true
  label:
    en_US: Sheets
    zh_Hans: 工作表
  human_description:
    en_US: 'REQUIRED, one or more sheets. Each item: {name, columns:[{key,header}], rows:[{key:value}]}.'
    zh_Hans: 必填,至少 1 个工作表。每项:{name 名称, columns 列定义[{key,header}], rows 行数据[{key:value}]}。
  form: llm
description:
  human:
    en_US: Create an Excel workbook with one or more sheets of tabular data (auto-styled
      header). Returns a public download link.
    zh_Hans: 根据一个或多个工作表数据生成 Excel(.xlsx),自动美化表头,返回公开下载链接。
  llm: 'Create an Excel (.xlsx) workbook. REQUIRED arguments that must always be provided:
    username (current user identity, so the file belongs to that user, not "system"),
    filename (download name WITHOUT extension), title, and sheets (at least 1: [{name,
    columns:[{key,header}], rows:[{key:value}]}]). Before calling, tell the user you
    are generating the document; after the call, show the user the returned download
    url and report success or the failure reason. The tool returns a JSON object with
    a public download url.'
